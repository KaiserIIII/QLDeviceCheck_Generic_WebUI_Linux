name: Offline acceptance checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python validate_config.py
      - run: python self_test.py
      - run: python -m coverage run --source=inspection,core.protocol_engine,core.transport -m pytest
      - run: python -m coverage report --show-missing
      - run: python -m compileall -q inspection core web_app.py legacy_web.py
