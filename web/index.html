<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QL DeviceCheck · 现场验收工作台</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>
<aside><a class="brand" href="/"><b>QL<span>•</span></b><div>DEVICECHECK<small>FIELD ACCEPTANCE</small></div></a><div class="nav-label">工位工作台</div><nav aria-label="主导航"><button data-view="overview" aria-label="工位总览">▦　工位总览</button><button data-view="new" aria-label="新建验收">＋　新建验收</button><button data-view="catalog" aria-label="设备清单">◫　设备清单</button><button data-view="history" aria-label="任务历史">◷　任务历史</button><button data-view="config" aria-label="配置校验">≋　配置校验</button></nav><div class="station"><i></i><span id="station-mode">连接中</span><small>应检设备 · 协议证据 · 复测追溯</small></div></aside>
<div class="workspace"><header><div><span>验收中心 / </span><strong id="page-name">工位总览</strong></div><div class="actions"><code id="mode-badge">CONNECTING</code><button class="text" data-action="credentials">访问凭证</button></div></header><div id="notice" role="status" aria-live="polite" hidden></div><main id="main"><div class="empty">正在读取工位数据…</div></main><footer>QL DeviceCheck <span>现场记录保存在当前工位 · v3.0</span></footer></div>
<dialog id="evidence" aria-label="设备测试证据"><div class="card-head"><div><small class="eyebrow">PROTOCOL EVIDENCE</small><h2>设备测试证据</h2></div><button class="secondary" data-action="close-evidence" aria-label="关闭证据">×</button></div><div id="evidence-body" class="pad"></div></dialog>
<dialog id="credentials" aria-label="访问凭证"><form id="credentials-form" class="pad"><h2>连接受保护的工位</h2><p class="muted">令牌仅用于本次浏览器会话，不写入报告。</p><label>访问令牌<input name="token" type="password" maxlength="4096" autocomplete="off"></label><div class="actions form-actions"><button type="button" class="secondary" data-action="close-credentials">取消</button><button class="primary" type="submit">保存并连接</button></div></form></dialog>
</body></html>
